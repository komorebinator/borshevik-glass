description: "How work is done on Borshevik Glass, one of Borshevik's own GNOME Shell extensions, in a repository of its own. As on Borshevik itself and on the Workspace Manager, the maintainer works on `experimental` and brings what is tried to `main` by pull request; there are no pipelines of the extension's own. A change is tried before it is committed, twice: by the agent in the test machine shared by Borshevik's extensions, where the scenarios run against a real GNOME Shell and screenshots show what they draw (test-vm, try_in_vm), then by the author in their own session, which no machine replaces — whether a tint looks right is the author's to judge on a real screen. Only then is it committed and pushed — to `experimental`, which no build reads. The fact that shapes the rest is that a push to `main` is a delivery: once Borshevik's list of extensions (build_files/scripts/gs-extensions/list.json in the Borshevik repository) names this repository, every build of Borshevik's final layer, standard and NVIDIA, clones its `main` (list.json names the branch), so whatever `main` carries at that moment goes into the next Borshevik `:latest`, with no tag or release in between. Borshevik's `experimental` builds read the extension's `main` too, so there is no way to try a change inside a built image without having already delivered it; that is why the work lives on `experimental` until the author decides it ships, and why a pull request into `main`, not a push, is the moment of delivery. From `:latest` on, the change travels with Borshevik and reaches users the way Borshevik's own workflow moves any change. The extension is not on extensions.gnome.org, so there are no versions and no release notes, and nothing reads metadata.json's `version`."
extends: "@DuckWorkflow"
main_branch: main
guidelines:
  - Never merge into `main` to find out whether something works. `main` is read by every Borshevik build, `experimental` ones included, so the moment a change reaches it is the moment it reaches `:latest` and everyone following it; the only places to try a change without delivering it are a test machine and a local session. Pushing to the extension's `experimental` delivers nothing, and is how work is kept safe off one machine.
  - "Borshevik installs the extension by copying its directory as it stands on `main` and compiling its GSettings schemas, which list.json must name — nothing else is built. The compiled Russian translation under `locale/` is therefore what the image ships: a change to `po/ru.po` is not finished until the `.mo` is regenerated with msgfmt and committed alongside it, and a string added to or changed in the sources goes into the `.pot` and `ru.po` in the same change. `schemas/gschemas.compiled` is the opposite case — ignored by git and compiled at install time, by the image build, by the test machine's deploy and by @BorshevikGlassExtension#recipes#run — so it is never committed."
  - "`shell-version` in metadata.json must name the GNOME version the current Borshevik image ships. list.json does not set `forceGnomeVersion` for Borshevik's own extensions, so when Borshevik moves to a new GNOME release the extension silently stops loading in the image until its metadata is updated and pushed — check this whenever Borshevik's base changes GNOME version, not only when the extension itself changes. A new GNOME release is also when the restyled selectors of GNOME's theme are checked again (@BorshevikGlassExtension)."
branches:
  - id: main
    description: "What ships. Once Borshevik's list of extensions lists the extension, Borshevik's final-layer build clones it at whatever commit it holds when the build runs — including builds of Borshevik's own `experimental` — so nothing reaches it that has not already been tried. Changes arrive by pull request from `experimental` once tried, and nothing is committed here that is not on `experimental` first — save a fix that cannot wait while `experimental` carries work not yet trusted: that goes on a short-lived branch from `main`, by pull request, and `experimental` takes it from `main` afterwards."
  - id: experimental
    description: Where the work is committed and pushed, and tried from the working tree; no Borshevik build reads it, so a push here ships nothing. Now it carries the extension's first version, which goes to `main` in one pull request once the author trusts it — and with it Borshevik's change that replaces Blur my Shell (@BorshevikGlass's guideline on replacing it).
channels:
  - id: borshevik-image
    from: main
    description: "The way the extension reaches anyone, once Borshevik's list of extensions lists it: installed system-wide into Borshevik images at build time. Not a channel the extension controls — it is Borshevik's `:latest` (testers; every build lands there) and then `:stable` (users; moved there by hand), as Borshevik's own workflow declares them. The extension only feeds it, by what `main` carries when a Borshevik build runs. Until list.json names the extension, `main` reaches no one."
steps:
  - id: requested
    description: A change is wanted — a bug seen in daily use, or a request in the conversation. It is clarified, then written into the terms.
    when: a request exists that the project's terms do not yet reflect
  - id: specified
    description: The change is in the spec, which is consistent, but the sources do not implement it yet.
    when: the change is present in the terms, verify_project is clean, and the sources do not yet implement it
    operation: "@Software#recipes#build"
  - id: implemented
    description: "The working tree carries the change and the spec validates, but nobody has seen it run. The agent tries it in the test machine first (try_in_vm), which shows whether the change does what was asked and catches what breaks — an extension that fails to load, errors in the journal, a surface left transparent — without the author. A test machine has a virtual GPU, one wallpaper and not the author's screen, so it does not replace the author's look; it makes sure that what the author looks at already works. A failure sends the change back to `requested`."
    when: the working tree carries the change, @DuckspecProject#recipes#validate passes, and the change has not been tried in a test machine since it was last edited
    operation: "@BorshevikGlassWorkflow#recipes#try_in_vm"
  - id: tried_in_vm
    description: The change worked in a test machine as intended, but no session of the author's has run it yet. The extension's own run recipe links the working tree in and asks the author to log in again.
    when: the change was tried in a test machine since it was last edited and worked there, and the author's running gnome-shell process started before the change was last edited
    operation: "@Software#recipes#run"
  - id: testing_locally
    description: "A fresh session runs the change from the working tree, and the author looks at it on their own screen, in both colour schemes — the behaviour that was asked for, and nothing around it broken. Only the author can say it looks right; nothing here checks it. Errors the extension throws land in the user journal, which is worth reading before calling it done."
    when: the running gnome-shell process started after the change was last edited, and the author has not yet confirmed it works
    operation: "@Git#recipes#commit"
  - id: committed
    description: The change is recorded locally and has reached no one. Pushing it to `experimental` keeps it safe off this machine and delivers nothing.
    when: local commits carry the change and are not on the remote
    operation: "@Git#recipes#push(branch=experimental)"
  - id: on_experimental
    description: "The change is on `experimental`, reaches no build, and goes on being used from the working tree, more changes joining it there. It goes to `main` when the author says it should ship — a decision of theirs, not a check: everything that checks a change has already run on it before it was committed. The pull request's description says what the branch brings and how it was tried."
    when: experimental carries the change, main does not, and no pull request into main carries it
    operation: "@GitHub#recipes#open_pull_request(head=experimental, base=main)"
  - id: in_review
    description: "A pull request from `experimental` to `main` carries the change. Merging it delivers it, once list.json names the extension: the next Borshevik build clones `main`."
    when: an open pull request into main carries the change
    operation: "@GitHub#recipes#merge_pull_request(strategy=merge)"
  - id: on_main
    description: "The change is on main and waits for a Borshevik build to pick it up. Nothing in the extension's repository starts one: Borshevik's daily schedule does, or a build started by hand in the Borshevik repository. Only the final layer needs rebuilding (Borshevik's build-borshevik workflow)."
    when: main carries the change and no Borshevik image on `:latest` was built after it was pushed
  - id: on_latest
    description: "A Borshevik image carrying the change is on `:latest`, where testers get it. It reaches users when that build, or a later one, is promoted to `:stable` — a step of Borshevik's own workflow, performed in the Borshevik repository, not here."
    when: a Borshevik image on `:latest` was built after the change was pushed, and `:stable` resolves to an image built before it
  - id: on_stable
    description: The change reaches users through Borshevik's `:stable`.
    when: "`:stable` resolves to a Borshevik image built after the change was pushed"
components:
  - id: test-vm
    type: "@Script"
    src:
      - tests/vm.sh
      - tests/vm/unsafe-mode@borshevik-test/extension.js
      - tests/vm/unsafe-mode@borshevik-test/metadata.json
      - tests/scenarios.js
      - tests/vm/run.js
    description: "The test machine try_in_vm uses, and everything needed to work it, in this repository: a clone of it alone is enough to try a change. It is the machine all of Borshevik's own extensions share (the Workspace Manager's repository describes it at more length): one kept machine in ${XDG_CACHE_HOME:-~/.cache}/borshevik-extensions-vm, running Borshevik's `:latest`, with user `tester` logged in by GDM and the unsafe-mode helper that lets org.gnome.Shell.Eval answer; each repository keeps its own copy of this script, which works it the same way and adds the commands its own extension needs. One try at a time: `start` refuses while the machine runs, which is how a try from another repository shows itself — and is never stopped from here. The script is taken from the Workspace Manager's copy, the most recent one, with its setup, start, ssh, eval, key, shot and stop as they are there. Its deploy installs this extension for tester, compiles its schema there, and disables Blur my Shell for tester while the image still ships it, since the two must not run together. What it adds is below."
    functions:
      - id: scheme
        description: "`vm.sh scheme <dark|light|light-only>` — sets tester's org.gnome.desktop.interface color-scheme to prefer-dark or default, as Quick Settings' Dark Style toggle does, or to prefer-light, which only gsettings sets and which alone makes GNOME Shell itself light; then leaves the shell a moment to redraw."
      - id: wallpaper
        description: "`vm.sh wallpaper <file>` — copies an image into tester's home and makes it tester's wallpaper in both schemes. The scenarios use two that tests/vm/run.js draws itself, fine stripes of two colours each, the two far apart in colour: blurred, each is a flat field of its stripes' average, so the colour every surface must show is known from it, the lift the glass is baked with and the accent over it, a picture still striped is one that was not blurred, and a stale picture is told from a fresh one."
      - id: pointer
        description: "`vm.sh pointer <x> <y>...` — moves the pointer through points of the screen, in its pixels, a moment apart, through the machine's usb-tablet, whose absolute axes span the whole screen. A hover is what the shell repaints in part, which setting an actor's hover from Eval does not reproduce: the steps the folder's dynamic blur left around a hovered icon showed only with the pointer."
      - id: scenarios
        description: "`vm.sh scenarios [filter]` — runs tests/vm/run.js with the host's gjs, which acts out every scenario of tests/scenarios.js whose path contains <filter> in tester's session and prints ok, FAIL or SKIP for each, with what was expected and what was found on a failure, and a screenshot of each in the machine's directory. Its `when` is done the way a user would — keys through QMP for the overview, the app grid and a workspace switch, `scheme` and `wallpaper` for the settings — and its `then` is judged against what can be seen: pixels of the screenshot sampled where a surface is — the panel's strip, the overview's background, the dash, an open folder — and compared with the same places of the wallpaper and with GNOME's own colours, so a surface left solid, left transparent over nothing or tinted with the wrong scheme fails; and, through Eval, which actors the extension added and whether any of them carries a blur effect in BACKGROUND mode, which none may. A scenario only a person can judge — whether a tint looks right — is marked so and skipped. Exits 1 when any scenario failed."
  - id: appearance-lab
    type: "@Script"
    src:
      - tests/appearance/lab.sh
      - tests/appearance/glass.py
      - tests/appearance/render.py
      - tests/appearance/apps.py
      - tests/appearance/looks.py
      - tests/appearance/store.py
      - tests/appearance/picks.py
      - tests/appearance/server.py
      - tests/appearance/measure.py
      - tests/appearance/results.py
      - tests/appearance/results/calibration.json
      - tests/appearance/results/reference.json
      - tests/appearance/results/looks/
      - tests/appearance/icons.sh
      - tests/appearance/requirements.txt
      - tests/appearance/calibrate/capture.sh
      - tests/appearance/calibrate/edge.py
      - tests/appearance/calibrate/fit.py
      - tests/appearance/calibrate/compare.py
      - tests/appearance/calibrate/geometry.js
      - tests/appearance/README.md
    description: "Where the extension's look was explored before it was tuned live (decisions#live-instead): a model of what the extension draws — the wallpaper as GNOME's zoom places it, blurred as Shell.BlurEffect does, lifted to a lightness as the extension's GLSL effect does (or, for looks before it, under a tint), with the stylesheet's surfaces — measured on every wallpaper of a collection and shown frame by frame on a local web page. It was made because the look depends on the wallpaper and a user keeps any wallpaper through both colour schemes, so a colour right on one screen can be grey, garish or unreadable on another (README.md, Results). Its frames and measures then turned out not to show what the author's screen showed — a panel the model drew black was olive on the screen — and colours are chosen live since (judge_look); the model knows nothing of the rules the glass now adapts by, nor of the band under the panel. Its blur cache and its survey of a collection's wallpapers served that tuning, and its frames still show a look's surfaces side by side. The model is tied to GNOME by calibrate: Shell.BlurEffect at radius 30 is a Gaussian of sigma 15 logical px in sRGB space, and the model's glass matches screenshots of the real one within ΔE 0.6. Looks are parameter sets. looks.py holds SHIPPED — what the extension draws — and the round being held, if any, with the variant chosen and the author's verdict; a round is working material, cleared from looks.py once decided, its outcome told in README.md's results. The light and the dark case are separate throughout: a look is one case's, a round explores one case, and every look the author marks good is kept as a snapshot of its case in results/looks/ (store.py), never overwritten and removed only at the author's word, so a liked look is not lost to later edits. results/reference.json names the reference — the look the extension is aimed at — as a pair: a kept light look and a kept dark look — which ones, the file says — each with every reference before it, so a reference replaced is not lost either. Making a look the reference moves its own case's pointer only, so work on one case cannot move the other; the two meet only in the reference, and on the page, where a look shown in the other case stands beside that case's reference. A collection is whatever directories are given, the system's wallpapers (/usr/share/backgrounds) by default, and results never name a wallpaper: a wallpaper is described by its classes — dark, medium or light, muted to colourful, busy under the panel — and a round's wallpapers are picked by a rule (the darkest, where a look reads worst), because what fails on one dark wallpaper fails on anyone's and a file name carries nothing over. What is found is kept in results/ — the calibration, and each look measured on a collection, overall and per class; how it was found and why it came out so is README.md's. Frames, the blur cache and which files a round drew on stay in ${XDG_CACHE_HOME:-~/.cache}/borshevik-glass-appearance with the venv, made again by the commands. Runs on the host like test-vm; app icons are rasterised from the host, not committed."
    functions:
      - id: setup
        description: "`lab.sh setup` — makes the venv (numpy, Pillow, SciPy) and rasterises the icons the frames are drawn with."
      - id: stop
        description: "`lab.sh stop` — stops the server, and with it its pool of drawing processes."
      - id: measure
        description: "`lab.sh measure [look] [--wallpapers DIR...] [--collection NAME] [--all-accents] [--record]` — a look over a collection in both cases: WCAG contrast at the worst 1 % of the places text lies (panel, app labels, dock, open folder), with how many wallpapers fall below 4.5:1 and 3:1, the glass's lightness and colour, how the dock and an open folder stand out, and the accent's visibility — overall and per lightness class; with --all-accents, the worst text for each of GNOME's accents; with --record, kept in results/measures/<look>-<collection>.json. No decision rests on it any more: its numbers did not predict what the author saw (judge_look)."
      - id: serve
        description: "`lab.sh serve [--wallpapers DIR...] [--open]` — the lab as a page on 127.0.0.1: a frame on the left, drawn on demand at the screen's full logical size and cached; on the right a kept look or a round's variant, the dark or the light case, any of GNOME's accents, the view — the desktop with a window under the panel, the overview, an open folder — the rule the collection's wallpapers are picked by (named by their classes) and which of them, with that frame's measures. Every frame's address carries a fingerprint of the code that draws it, taken as the server starts, so a frame a browser or the cache kept from older code is never shown again. One frame at a time, in place — variants on the number keys, wallpapers on the arrows, views on A S D, the case on T, taken by the key's place so any layout works; Space held puts the reference in the frame's place, same case, wallpaper, view and accent: side by side and small, the author saw no difference between variants that flipping showed plainly. The page keeps what is on screen as a look of its case and makes a kept look its case's reference (store.py); nothing else it does writes outside the work directory."
      - id: rounds
        description: "`lab.sh rounds` — the round in progress in looks.py, if any, with the rule its wallpapers are picked by, the variant chosen and the verdict."
      - id: results
        description: "`lab.sh results` — what results/ holds: the calibration, and every look measured on every collection, by class."
      - id: calibrate
        description: "`lab.sh calibrate [wallpaper]` — in the running test machine (test-vm), blurs a black-to-white step with the tint off and fits its sigma, reads GNOME's geometry, and photographs the shipped glass on a real wallpaper (by default the release's own, an sRGB one) in both cases to compare with the model; records it in results/calibration.json. Run again when GNOME's blur, geometry or colour management, or the extension's composition, change: the lab is only as good as this fit."
    decisions:
      - id: live-instead
        description: "Colours are chosen live on the author's screen, not in the lab: choosing by its frames was slow and indirect, and its measures did not predict what the author saw. The lab stays for what it still does."
        rejected:
          - going on choosing by the lab's frames and measures
        by: author
        date: 2026-11-20
recipes:
  - id: try_in_vm
    description: Tries the working tree in the shared test machine (test-vm) by running its scenarios against the real shell; what is left to a person is how it looks, and that is the author's own try.
    instructions:
      - "If ${XDG_CACHE_HOME:-~/.cache}/borshevik-extensions-vm has no disk.qcow2, make the machine with `tests/vm.sh setup` — it asks the author for their password once and takes a while, so say so first. Then `tests/vm.sh start`, which brings it to the current Borshevik `:latest` and logs tester in. If it refuses because the machine is running, a try from another extension's repository may be in progress: ask the author before using it, and never stop it from here."
      - "`tests/vm.sh deploy` to run the working tree."
      - "`tests/vm.sh scenarios` and read every FAIL with its screenshot and the extension's lines in tester's journal from that moment: a failing scenario is a defect, in the extension or in the scenario, and which of the two is settled before going on. The SKIPs are what is left for the author's eye."
      - "Only for what the scenarios do not reach, look by hand: `vm.sh eval` for the shell's state, tester's journal (`vm.sh ssh journalctl -b _UID=<tester's uid>`), `vm.sh shot` for what the screen shows. A case that keeps coming back to the hand is a scenario not yet written: write it."
      - "Stop the machine when the trying is done, `tests/vm.sh stop`; it is not left running between tries."
      - "Report each case and what was seen, with the screenshots of both schemes. All as intended moves the change to `tried_in_vm`; anything else is a defect to fix first."
  - id: judge_look
    description: "How a change to the extension's colours, depths, surfaces or the rules they adapt by is decided: live, on the author's own screen, over many of their wallpapers — and then tried as any change is."
    instructions:
      - "Ask the author to let the agent into their session for the tuning: in Looking Glass (Alt+F2, lg) `global.context.unsafe_mode = true`, which lets org.gnome.Shell.Eval and the screenshot interface answer. Say what it opens — any process of theirs can run code in the shell while it is on — and that a relogin or the same line with false closes it. Ask before every screenshot of their screen, and take only the strip that is needed."
      - "Change one thing at a time, by a step large enough to see, and keep the previous value to go back to: re-bake a monitor's glass with another lift through the running extension's MonitorGlass (its stateObj), load a stylesheet over the extension's for a colour or a share, add a widget over the glass for a band. Say each value in numbers; the author answers by eye."
      - "Cover the space the rule must hold over: dark and light wallpapers, muted and very colourful, of different hues, in both cases, with more than one of GNOME's accents. Write down each wallpaper's file and what was chosen on it."
      - Fit a rule to what was chosen, then check it on wallpapers it was not fitted on, setting each to the rule's values and asking only whether it looks right; correct the rule where it does not, and check again. Where the author's judgement and a model disagree, the author's eye is the measure.
      - "Record the outcome: the rules and their numbers in the extension (adapt.js) and here, the evidence and what was rejected as decisions of the behaviours concerned. Then the change goes through the usual steps; the author's session returns to what they had once they log in again."
