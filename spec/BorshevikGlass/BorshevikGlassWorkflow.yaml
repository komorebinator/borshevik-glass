description: "How work is done on Borshevik Glass, one of Borshevik's own GNOME Shell extensions, in a repository of its own. As on Borshevik itself (@BorshevikWorkflow#branches) and on the Workspace Manager, the maintainer works on `experimental` and brings what is tried to `main` by pull request; there are no pipelines of the extension's own. A change is tried before it is committed, twice: by the agent in the test machine shared by Borshevik's extensions, where the scenarios run against a real GNOME Shell and screenshots show what they draw (test-vm, try_in_vm), then by the author in their own session, which no machine replaces — whether a tint looks right is the author's to judge on a real screen. Only then is it committed and pushed — to `experimental`, which no build reads. The fact that shapes the rest is that a push to `main` is a delivery: once @GnomeExtensions lists this repository, every final-layer build of @BorshevikImage and @BorshevikNvidiaImage clones its `main` (list.json names the branch), so whatever `main` carries at that moment goes into the next Borshevik `:latest`, with no tag or release in between. Borshevik's `experimental` builds read the extension's `main` too, so there is no way to try a change inside a built image without having already delivered it; that is why the work lives on `experimental` until the author decides it ships, and why a pull request into `main`, not a push, is the moment of delivery. From `:latest` on, the change travels with Borshevik and reaches users the way @BorshevikWorkflow moves any change. The extension is not on extensions.gnome.org, so there are no versions and no release notes, and nothing reads metadata.json's `version`."
extends: "@DuckWorkflow"
main_branch: main
guidelines:
  - Never merge into `main` to find out whether something works. `main` is read by every Borshevik build, `experimental` ones included, so the moment a change reaches it is the moment it reaches `:latest` and everyone following it; the only places to try a change without delivering it are a test machine and a local session. Pushing to the extension's `experimental` delivers nothing, and is how work is kept safe off one machine.
  - "Borshevik installs the extension by copying its directory as it stands on `main` and compiling its GSettings schemas, which list.json must name — nothing else is built. The compiled Russian translation under `locale/` is therefore what the image ships: a change to `po/ru.po` is not finished until the `.mo` is regenerated with msgfmt and committed alongside it, and a string added to or changed in the sources goes into the `.pot` and `ru.po` in the same change. `schemas/gschemas.compiled` is the opposite case — ignored by git and compiled at install time, by the image build, by the test machine's deploy and by @BorshevikGlassExtension#recipes#run — so it is never committed."
  - "`shell-version` in metadata.json must name the GNOME version the current Borshevik image ships. list.json does not set `forceGnomeVersion` for Borshevik's own extensions, so when Borshevik moves to a new GNOME release the extension silently stops loading in the image until its metadata is updated and pushed — check this whenever Borshevik's base changes GNOME version, not only when the extension itself changes. A new GNOME release is also when the restyled selectors of GNOME's theme are checked again (@BorshevikGlassExtension)."
branches:
  - id: main
    description: "What ships. Once @GnomeExtensions lists the extension, Borshevik's final-layer build clones it at whatever commit it holds when the build runs — including builds of Borshevik's own `experimental` — so nothing reaches it that has not already been tried. Changes arrive by pull request from `experimental` once tried, and nothing is committed here that is not on `experimental` first — save a fix that cannot wait while `experimental` carries work not yet trusted: that goes on a short-lived branch from `main`, by pull request, and `experimental` takes it from `main` afterwards."
  - id: experimental
    description: Where the work is committed and pushed, and tried from the working tree; no Borshevik build reads it, so a push here ships nothing. Now it carries the extension's first version, which goes to `main` in one pull request once the author trusts it — and with it Borshevik's change that replaces Blur my Shell (@BorshevikGlass's guideline on replacing it).
channels:
  - id: borshevik-image
    from: main
    description: "The way the extension reaches anyone, once @GnomeExtensions lists it: installed system-wide into Borshevik images at build time. Not a channel the extension controls — it is Borshevik's `:latest` (testers; every build lands there) and then `:stable` (users; moved there by hand), as @BorshevikWorkflow declares them. The extension only feeds it, by what `main` carries when a Borshevik build runs. Until list.json names the extension, `main` reaches no one."
steps:
  - id: requested
    description: A change is wanted — a bug seen in daily use, or a request in the conversation. It is clarified, then written into the terms.
    when: a request exists that the project's terms do not yet reflect
  - id: specified
    description: The change is in the spec, which is consistent, but the sources do not implement it yet.
    when: the change is present in the terms, verify_project is clean, and the sources do not yet implement it
    operation: "@Software#build"
  - id: implemented
    description: "The working tree carries the change and the spec validates, but nobody has seen it run. The agent tries it in the test machine first (try_in_vm), which shows whether the change does what was asked and catches what breaks — an extension that fails to load, errors in the journal, a surface left transparent — without the author. A test machine has a virtual GPU, one wallpaper and not the author's screen, so it does not replace the author's look; it makes sure that what the author looks at already works. A failure sends the change back to `requested`."
    when: the working tree carries the change, @DuckspecProject#validate passes, and the change has not been tried in a test machine since it was last edited
    operation: "@BorshevikGlassWorkflow#try_in_vm"
  - id: tried_in_vm
    description: The change worked in a test machine as intended, but no session of the author's has run it yet. The extension's own run recipe links the working tree in and asks the author to log in again.
    when: the change was tried in a test machine since it was last edited and worked there, and the author's running gnome-shell process started before the change was last edited
    operation: "@Software#run"
  - id: testing_locally
    description: "A fresh session runs the change from the working tree, and the author looks at it on their own screen, in both colour schemes — the behaviour that was asked for, and nothing around it broken. Only the author can say it looks right; nothing here checks it. Errors the extension throws land in the user journal, which is worth reading before calling it done."
    when: the running gnome-shell process started after the change was last edited, and the author has not yet confirmed it works
    operation: "@Git#commit"
  - id: committed
    description: The change is recorded locally and has reached no one. Pushing it to `experimental` keeps it safe off this machine and delivers nothing.
    when: local commits carry the change and are not on the remote
    operation: "@Git#push(branch=experimental)"
  - id: on_experimental
    description: "The change is on `experimental`, reaches no build, and goes on being used from the working tree, more changes joining it there. It goes to `main` when the author says it should ship — a decision of theirs, not a check: everything that checks a change has already run on it before it was committed. The pull request's description says what the branch brings and how it was tried."
    when: experimental carries the change, main does not, and no pull request into main carries it
    operation: "@GitHub#open_pull_request(head=experimental, base=main)"
  - id: in_review
    description: "A pull request from `experimental` to `main` carries the change. Merging it delivers it, once list.json names the extension: the next Borshevik build clones `main`."
    when: an open pull request into main carries the change
    operation: "@GitHub#merge_pull_request(strategy=merge)"
  - id: on_main
    description: "The change is on main and waits for a Borshevik build to pick it up. Nothing in the extension's repository starts one: Borshevik's daily schedule does, or a build started by hand in the Borshevik repository (@BorshevikWorkflow#steps#on_main). Only the final layer needs rebuilding (@BorshevikWorkflow#build-borshevik)."
    when: main carries the change and no Borshevik image on `:latest` was built after it was pushed
  - id: on_latest
    description: "A Borshevik image carrying the change is on `:latest`, where testers get it. It reaches users when that build, or a later one, is promoted to `:stable` — the step @BorshevikWorkflow#steps#built_from_main, performed in the Borshevik repository, not here."
    when: a Borshevik image on `:latest` was built after the change was pushed, and `:stable` resolves to an image built before it
  - id: on_stable
    description: The change reaches users through Borshevik's `:stable`.
    when: "`:stable` resolves to a Borshevik image built after the change was pushed"
components:
  - id: test-vm
    type: "@ShellScript"
    src:
      - tests/vm.sh
      - tests/vm/unsafe-mode@borshevik-test/extension.js
      - tests/vm/unsafe-mode@borshevik-test/metadata.json
      - tests/scenarios.js
      - tests/vm/run.js
    description: "The test machine try_in_vm uses, and everything needed to work it, in this repository: a clone of it alone is enough to try a change. It is the machine all of Borshevik's own extensions share (@BorshevikWorkspaceManagerWorkflow#test-vm describes it in full): one kept machine in ${XDG_CACHE_HOME:-~/.cache}/borshevik-extensions-vm, running Borshevik's `:latest`, with user `tester` logged in by GDM and the unsafe-mode helper that lets org.gnome.Shell.Eval answer; each repository keeps its own copy of this script, which works it the same way and adds the commands its own extension needs. One try at a time: `start` refuses while the machine runs, which is how a try from another repository shows itself — and is never stopped from here. The script is taken from the Workspace Manager's copy, the most recent one, with its setup, start, ssh, eval, key, shot and stop as they are there. Its deploy installs this extension for tester, compiles its schema there, and disables Blur my Shell for tester while the image still ships it, since the two must not run together. What it adds is below."
    functions:
      - id: scheme
        description: "`vm.sh scheme <dark|light|light-only>` — sets tester's org.gnome.desktop.interface color-scheme to prefer-dark or default, as Quick Settings' Dark Style toggle does, or to prefer-light, which only gsettings sets and which alone makes GNOME Shell itself light; then leaves the shell a moment to redraw."
      - id: wallpaper
        description: "`vm.sh wallpaper <file>` — copies an image into tester's home and makes it tester's wallpaper in both schemes. The scenarios use two that tests/vm/run.js draws itself, fine stripes of two colours each, the two far apart in colour: blurred, each is a flat field of its stripes' average, so the colour every surface must show is known from it and the tint the stylesheet names, a picture still striped is one that was not blurred, and a stale picture is told from a fresh one."
      - id: scenarios
        description: "`vm.sh scenarios [filter]` — runs tests/vm/run.js with the host's gjs, which acts out every scenario of tests/scenarios.js whose path contains <filter> in tester's session and prints ok, FAIL or SKIP for each, with what was expected and what was found on a failure, and a screenshot of each in the machine's directory. Its `when` is done the way a user would — keys through QMP for the overview, the app grid and a workspace switch, `scheme` and `wallpaper` for the settings — and its `then` is judged against what can be seen: pixels of the screenshot sampled where a surface is — the panel's strip, the overview's background, the dash, an open folder — and compared with the same places of the wallpaper and with GNOME's own colours, so a surface left solid, left transparent over nothing or tinted with the wrong scheme fails; and, through Eval, which actors the extension added and whether any of them carries a blur effect in BACKGROUND mode, which none may. A scenario only a person can judge — whether a tint looks right — is marked so and skipped. Exits 1 when any scenario failed."
recipes:
  - id: try_in_vm
    description: Tries the working tree in the shared test machine (test-vm) by running its scenarios against the real shell; what is left to a person is how it looks, and that is the author's own try.
    instructions:
      - "If ${XDG_CACHE_HOME:-~/.cache}/borshevik-extensions-vm has no disk.qcow2, make the machine with `tests/vm.sh setup` — it asks the author for their password once and takes a while, so say so first. Then `tests/vm.sh start`, which brings it to the current Borshevik `:latest` and logs tester in. If it refuses because the machine is running, a try from another extension's repository may be in progress: ask the author before using it, and never stop it from here."
      - "`tests/vm.sh deploy` to run the working tree."
      - "`tests/vm.sh scenarios` and read every FAIL with its screenshot and the extension's lines in tester's journal from that moment: a failing scenario is a defect, in the extension or in the scenario, and which of the two is settled before going on. The SKIPs are what is left for the author's eye."
      - "Only for what the scenarios do not reach, look by hand: `vm.sh eval` for the shell's state, tester's journal (`vm.sh ssh journalctl -b _UID=<tester's uid>`), `vm.sh shot` for what the screen shows. A case that keeps coming back to the hand is a scenario not yet written: write it."
      - "Stop the machine when the trying is done, `tests/vm.sh stop`; it is not left running between tries."
      - "Report each case and what was seen, with the screenshots of both schemes. All as intended moves the change to `tried_in_vm`; anything else is a defect to fix first."
