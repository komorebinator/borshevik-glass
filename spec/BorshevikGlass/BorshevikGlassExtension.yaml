description: "GNOME Shell extension entry point. Lays the wallpaper, blurred and lifted to a lightness of the current colour scheme's own, under the surfaces of GNOME Shell that Borshevik gives a frosted look — the top panel, the overview (window picker, app grid and search alike), and the gap between workspaces while they slide — with a little of GNOME's accent colour over it, and restyles through its stylesheets what sits on that glass: the dash, the search entry, workspace thumbnails, folder icons and an open app folder. What it covers and how each looks is `behaviour`; why the glass is baked once and where the cost of it goes, and how its colour is made, are in the guidelines."
extends: "@Extension"
target: "@GnomeShell"
platform: GJS (GNOME Shell 50) — Clutter, Meta, Shell, St, Main, Background
src: borshevik-glass@komorebinator/extension.js
guidelines:
  - "The glass is static: it is made once and afterwards only shown. For each monitor the extension blurs a copy of the wallpaper — a Meta.BackgroundActor that GNOME's own BackgroundManager keeps in step with the wallpaper settings — with Shell.BlurEffect in ACTOR mode, the way GNOME's own lock screen blurs its background, gives the blur its lightness with a GLSL effect after it (see the guideline on the glass's colour), and bakes the result into a texture: a do-nothing Clutter.OffscreenEffect around the two renders them into its own texture as they are first painted, and that texture is then kept as a Clutter.TextureContent while the effects and the blurred copy are destroyed (components#glass). Every surface shows that content, so the glass is baked when the wallpaper, a monitor, the scale factor, the colour scheme or a depth setting changes, and at no other time; drawing a frame only shows a texture already made. Effects left in place would not do: GNOME hides the overview's group whenever the overview closes, and an actor shown again is rendered again, effects and all, so the blur ran again at every opening of the overview — as the extension did until 2026-11-19, seen in the test machine — and Blur my Shell, which hangs its blur and shader effects on the background itself, pays that and its shaders on every frame besides. An actor cannot be painted into a texture of one's own from JavaScript (Clutter.PaintContext.new_for_framebuffer is not introspected), hence the effect's texture, the one thing here that rests on Clutter's internals: Clutter pads an offscreen effect's buffer so its size does not depend on sub-pixel position (_clutter_actor_box_enlarge_for_effects), 2 logical px before the actor and 1 after for a box on whole pixels, so the texture is 3 px larger than the monitor (1283×803 for a 1280×800 glass) with nothing in that margin. Each surface shows it at that offset and size and clips the margin away (glass.js BAKE_MARGIN): stretched to the monitor instead, it left a thin line along the screen's edges, which the author saw at scale 5/3 (2026-11-19). Dynamic blur (Shell.BlurMode.BACKGROUND, or the ext-background-effect-v1 protocol Mutter gained in GNOME 51) would instead copy and blur what is on the screen behind the surface at every repaint of it — the panel repaints with every tick of the clock and change of an indicator — and buys nothing here: Mutter keeps windows out from under the top panel, the overview and the workspace gap show the wallpaper anyway, and a full-screen window hides the panel. The protocol is not even reachable: it is for Wayland clients asking about their own windows, and the panel is an actor inside the shell. An open app folder is the one place something is blurred while the desktop is in use (`behaviour#folder-over-blur`): what lies under its card is the app grid, not the wallpaper, so it cannot be baked with the glass. It is blurred and baked as the folder opens and afterwards only shown, the way the glass is: clones of what lies under the folder, under Shell.BlurEffect in ACTOR mode, rendered once into a texture (components#folder-backdrop). Dynamic blur is what the extension used there until 2026-11-19, over the whole overview, and it showed both of its costs: frames dropped while the folder opened (8–10 frames over the opening in the test machine against 13–16 with no blur, 10–12 with the dynamic blur under the card alone), and steps of a different blur left around every icon hovered in the folder until something repainted the whole screen — a hover repaints only the rectangle around the icon, and the blur at that rectangle's edge has nothing beyond it to sample. The author saw the steps; the test machine reproduced them, under the card alone as well."
  - "Every surface shows the same picture: one baked glass per monitor, shown by an actor of its own in the panel, in the overview and in the workspace gap, each placed at the monitor's origin, so where one surface meets another — the panel over the overview — the pictures line up pixel for pixel and no seam shows. One texture shown three times, rather than a blurred copy per surface as before, bakes each monitor once and still keeps every surface an ordinary child of its own parent, shown and hidden with it."
  - "The glass has a lightness of its own and the wallpaper's hue — the luminosity idea of Windows' Acrylic — rather than a colour laid over the blur. The bake's GLSL effect turns each blurred pixel into CIELAB, sets its lightness L* to a target plus a gain × (L* − 50) — 0.3 in the dark case, so the wallpaper's light and dark show at a third of their strength around the target, and 0.6 in the light one, where a third left the overview a milky white (the author's choice, 2026-11-20) — scales its chroma, and turns it back into sRGB with every linear channel clamped, with the same constants the test machine's scenarios check it by. Lifted rather than covered, the glass keeps the wallpaper's hue — a pastel in the light case — where a tint laid over the blur, what the extension drew until 2026-11-19, made the light case grey over dark and medium wallpapers: white over a dark picture is either grey or opaque. The target and the chroma kept adapt to the wallpaper, by rules the author tuned live on their own screen (`behaviour#follows-wallpaper`, decisions#live-tuned; components#adapt holds the numbers). In the dark case the target falls as the strip under the panel gets lighter — the panel is what the eye judges a dark glass by — and the chroma kept is what leaves a set amount of colour in the glass, by the wallpaper's mean hue: most for purple and magenta, least for blue, since colour in a dark glass, blue above all, reads as a glass that lets the wallpaper through. The light case keeps its target, 80, and the wallpaper's full chroma up to a cap a garish orange glass showed the need of, higher for purple and magenta. The chroma is found on the lifted pixels themselves, since clamping in sRGB lights dark saturated colours up, which a model of the chroma alone missed by half. The strip under the panel is baked a little darker in the dark case and a little lighter in the light one, fading out below it, so the panel can be denser than the overview with one picture and no seam (`behaviour#panel-and-overview-meet`, decisions#panel-band). Over the baked glass lies a translucent St.Widget of GNOME's accent colour, 8 % in the light case; in the dark case purple's 3.2 %, scaled by purple's luminance over the accent's, since a light accent — yellow, orange — tinted the dark glass far more than purple at the same share (the author's choice, 2026-11-20). A change of the accent colour or of the accent settings never re-bakes. The panel is the same glass as the overview in both cases, so they meet with no seam, and the Workspace Manager's grey icons read on the panel as they do on the overview: a lighter panel of its own washed them out (the author's choice, 2026-11-19). The dock, folder tiles in the grid and the controls of an open folder are the case's surface colour with a quarter of the accent mixed in, an open folder's card the same (`behaviour#folder-over-blur`, decisions#card-accent) — in the light case; the dark case takes half of the surfaces' share, 12.5 %, since at the light case's the dark surfaces were too colourful on the author's own screen, half looking right there (the author's choice, 2026-11-19). The dock, folder tiles and the card are panes of glass, each with a fine outline, dark in the light case and light in the dark one (decisions#panes of dock-and-overview-components). With the glass's share these are scaled together by the accent strength, so their proportions stay. They are written as st-mix(-st-accent-color, …, N%) — St's own colour functions, which GNOME's theme uses for its accent — in a stylesheet the extension fills in from its settings (components#accent-styles), so GNOME resolves the accent colour itself, and the extension writes the stylesheet again only for a new accent setting, or a new accent colour that changes the dark glass's share."
  - "Light or dark is decided by GNOME's dark style alone, unless the light style is switched off in the extension's preferences (`behaviour#light-optional`) — org.gnome.desktop.interface color-scheme, which Quick Settings' Dark Style toggle and Settings › Appearance set: dark for prefer-dark, light for default and prefer-light (the author's decision, 2026-11-03). GNOME Shell 50 left to itself decides otherwise: its user session mode has the colour scheme prefer-dark, under which the shell is light only for prefer-light, a value neither toggle ever sets — so with dark style off applications are light while the panel, menus, Quick Settings and notifications stay dark. While enabled, the extension sets the session mode's colorScheme to prefer-light, under which the shell is dark only for prefer-dark: GNOME's own light variant then covers the panel, menus and popups by the same rule as the glass. With the light style switched off it sets force-dark instead, under which the shell is dark whatever color-scheme says, prefer-light included. It puts the value back on disable, and sets it again whenever the session mode is updated, since GNOME rebuilds the mode's properties from its table then; after each change it notifies St.Settings' color-scheme, which is what makes GNOME Shell reload its stylesheet. The extension's own rules switch on the same rule: it marks Main.uiGroup with the style class borshevik-glass-light while light, so one stylesheet holds both — its plain rules the dark case, the rules under that class the light one."
  - "Colours live in the stylesheets, not in the code: the surfaces' base colours, the text's and the outlines' in the stylesheet (components#stylesheets), the rules that mix in the accent in the accent template (components#accent-styles), of which the code fills in only the shares; Only what no stylesheet can express is in the code: the glass's lightness and chroma, the band under the panel and the dark glass's share of the accent, all by rules of the wallpaper or the accent (components#adapt). GNOME keeps the overview, the dash and app folders dark even in its own light variant, and its panel's text white in the overview; the light rules deliberately go further and make them light too, with dark labels, so the whole desktop follows the setting (the author's decision, 2026-11-03). Those are restyled GNOME selectors, the ones to check whenever GNOME's theme changes; the popups' rules are generated from GNOME's own stylesheets by tools/popups.py, to be run again then (`behaviour#popups`). What those colours are is decided live, on the author's own screen and over many of their wallpapers rather than one (@BorshevikGlassWorkflow#recipes#judge_look): a look chosen on one wallpaper turned out grey on most others, and a model of the glass, judged by its frames and measures, did not show what the author's screen showed."
  - "The extension adds actors to GNOME's and restyles GNOME's through its stylesheet; it replaces no method of GNOME Shell. Where something appears only for a moment — the monitor groups of a workspace switch — it is found by watching for it being added to Main.uiGroup by its style class, workspace-animation, rather than by patching WorkspaceAnimationController, so a change inside GNOME's animation code cannot leave a patched method calling into nothing. The folder veil is taken away the same way: GNOME's AppFolderDialog eases its own background_color to black at 204/255 as it opens (85/255 while an icon is dragged over it, transparent as it closes); the extension watches each dialog as it is added to the overview group and, whenever that colour starts to change, drops the running transition and keeps the colour clear. The same watch gives each dialog the blur under its card (components#folder-backdrop), which follows the card as GNOME animates it, so it needs no animation of its own and cannot fall out of step with GNOME's. Blur my Shell instead replaced the dialog's _zoomAndFadeIn and _zoomAndFadeOut with copies of its own, which would carry a copy of GNOME's animation code to keep in step."
  - "Runs in the user session mode only: metadata.json names no other session mode, so GNOME disables the extension while the screen is locked and enables it again on unlock. The lock screen keeps GNOME's own blur (the author's decision, 2026-11-03), and the panel GNOME shows over it is transparent there anyway. Being enabled again at every unlock means the glass is baked again then, once per monitor, which is the one recurring cost the extension has."
recipes:
  - id: run
    description: "Makes the next GNOME Shell session on this machine run the extension straight from the working tree, so a change can be tried before it is committed. The extension is installed per user as a symlink into the repository; a copy under the same UUID in ~/.local/share takes precedence over one the Borshevik image installs in /usr/share/gnome-shell/extensions, so the session runs the working tree, not the image's copy of `main`."
    instructions:
      - "Check ~/.local/share/gnome-shell/extensions/borshevik-glass@komorebinator. If it is missing, create it as a symlink to this repository's borshevik-glass@komorebinator/ directory. If it is a real directory, or a symlink pointing anywhere else, stop and ask — it is an installation someone made on purpose."
      - "While Borshevik still ships Blur my Shell, disable it for the author's user with `gnome-extensions disable blur-my-shell@aunetx` and say so: the two must not run together (see the project's guideline on replacing it). Re-enabling it is the author's to ask for."
      - "Compile its GSettings schema in place with `glib-compile-schemas borshevik-glass@komorebinator/schemas`; the output is ignored by git, and the image compiles its own at build time."
      - "Check `gnome-extensions info borshevik-glass@komorebinator` and enable it with `gnome-extensions enable` if it is not enabled. A running shell only knows the extensions it found at login, so on a machine that has never had this one both report that it does not exist; then append its uuid to org.gnome.shell `enabled-extensions` with gsettings instead, which the next session reads."
      - "GNOME Shell on Wayland cannot reload an extension or restart in place: ask the author to log out and back in. Never do it for them — it ends every program in the session, this one included."
      - "Once they are back, look for errors the extension threw since login in `journalctl -b /usr/bin/gnome-shell`, and report them before the author starts looking."
behaviour:
  - id: frosted-surfaces
    description: "Behind the top panel, the overview — the window picker, the app grid and search results alike — and the gap between workspaces while they slide outside the overview, the user sees the wallpaper of that monitor, blurred and brought to the scheme's lightness — light in the light case, dark in the dark one — keeping the wallpaper's hue, with a little of the accent over it, where GNOME draws a solid colour. On a machine with several monitors every monitor's overview and workspace gap shows its own wallpaper; the panel is on the primary monitor only, as GNOME's is. What a surface shows is always the wallpaper, never the windows: nothing behind the panel is ever a window, and in the overview and the gap the windows are drawn above the picture."
    scenarios:
      - id: panel-on-desktop
        given: the desktop with no window open, the dark scheme
        when: the top panel is looked at
        then: it shows the wallpaper of the strip it covers, blurred and darkened, instead of GNOME's black, with the panel's text and icons over it
      - id: overview-and-app-grid
        given: the dark scheme
        when: the overview is opened, then the app grid
        then: both show the whole wallpaper blurred and darkened behind the workspaces and the icons, instead of GNOME's grey
      - id: workspace-gap
        given: two workspaces, a window on each, the overview closed
        when: the user switches to the other workspace with the keyboard
        then: while the workspaces slide, the gap between them shows the blurred, tinted wallpaper instead of GNOME's grey band, and once the slide ends the desktop is as before
      - id: second-monitor
        given: two monitors with different parts of a spanned wallpaper, or different wallpapers
        when: the overview is opened
        then: each monitor shows its own wallpaper blurred, and the panel only the primary's
  - id: dock-and-overview-components
    description: "What sits on the frosted overview is restyled to sit on glass rather than on GNOME's solid grey: the dash's background, the search entry, workspace thumbnails, folder icons in the app grid, the page arrows and the search results section get a translucent background of the scheme's surface colour with a quarter of the accent in it instead of an opaque one — a dark grey in the dark case, a light grey in the light one — and the dash and folder tiles, with an open folder's card, a fine outline, light in the dark case and dark in the light one, so they read as panes of glass — and app icons and dash items lose the square backdrop GNOME gives them, keeping their hover and focus highlight. It is the look Borshevik had with Blur my Shell's dark overview components, carried over in the dark scheme and mirrored in the light one."
    scenarios:
      - id: dash
        given: the overview open, the dark scheme
        when: the dash is looked at
        then: its rounded background is translucent, so the blurred wallpaper shows through it, and its icons have no square backdrop until hovered
      - id: dash-hover
        given: the overview open, in either scheme
        when: the pointer rests on an icon in the dash, or the app grid's button is checked
        then: a rounded highlight of the surface colour shows behind that icon — in the dark scheme as in the light one
      - id: search
        given: the overview open
        when: something is typed into the search entry
        then: the entry and the results section are translucent over the blurred wallpaper and their text reads clearly
    decisions:
      - id: panes
        description: "The dock, folder tiles and an open folder's card are panes of glass: a translucent surface — 56 % of it seen in the light case, 35 % in the dark one — with a 1 px outline inside its edge, an inset shadow so it does not grow them; dark (34, 34, 38 at 12 %) on the light glass, white at 8 % on the dark. The author found the light dock and folder tiles looked like panes of glass and made that the standard in both cases (2026-11-20); the dark surfaces then went from grey 100 to grey 50 at the same alpha, close to the dark glass, which the author found best of 100, 70, 50 and 30, and the light ones from near-white 250 to 235."
        rejected:
          - white outlines at 12 and 18 % in the dark case — 8 % was the one taken
          - dark grey 30 — worse than 50
          - in the light case, the panel drawn as the dock's pane over the glass, bare in the overview, with or without an outline under it — the overview looked better with the white band
        by: author
        date: 2026-11-20
  - id: folder-over-blur
    description: "An open app folder is a card over the overview, read as a card of its own because what lies under it is blurred: GNOME's black veil at 80 % over the whole overview is taken away (decisions#no-veil), and only what lies under the card is blurred, the overview around it staying sharp and as it was (decisions#card-only-blur). The blur goes with the card: it has the card's rounded shape, follows it as it grows out of the folder's tile and shrinks back into it, and fades in and out with it. It is made once, as the folder opens, and only shown while the folder stays open (see the guideline on static glass), so a hover inside the folder repaints nothing of it. The card itself is the dock's pane of glass, in its colour, accent and outline (decisions#card-accent), and the blur under it keeps the grid from competing with the folder's own icons (see the guideline on the glass's colour). With nothing veiled, the panel stays its own glass while a folder is open."
    scenarios:
      - id: folder-open
        given: dark style off, the app grid with a folder
        when: the folder is opened
        then: it opens as a light glassy card with the overview blurred under it, and around the card the overview is sharp and not darkened, instead of GNOME's near-black
      - id: no-veil
        given: dark style on, the app grid with a folder, animations on as on real hardware
        when: the folder is opened
        then: the overview around the card is the glass as it was, with no veil easing in, and the shell does not blink
      - id: folder-closed
        given: a folder open
        when: it is closed
        then: the blur under it is gone with the card, the panel is its own glass, and nothing is blurred while no folder is open
      - id: hover-leaves-nothing
        given: a folder open, the pointer away from it
        when: the pointer passes over an icon in the folder and leaves it
        then: the card and the blur under it are as they were before, with no patch of a different blur left around the icon — the same as after the whole screen is repainted
      - id: folder-accent
        given: the accent tint on, a folder open
        when: the accent tint is switched off in the preferences
        then: the card loses its hue of the accent at once, while the overview around it stays as it was
      - id: panel-unchanged
        given: the app grid with a folder, the dark scheme
        when: the folder is opened
        then: the strip under the panel is its own glass, as with no folder open
    decisions:
      - id: no-veil
        description: "No veil over the overview behind an open folder: the blurred card alone sets the folder apart. GNOME eases its veil in and out with the card, and that animation — GNOME's, retargeted to a lighter veil of the extension's — made the whole shell blink as a folder opened, most at the first opening after the overview was closed, and spoiled the look; with the veil gone the author found the opening smooth and better looking (2026-11-20). With it went hiding the panel's glass while a folder was veiled, which a veiled overview needed so as not to leave the strip bright."
        rejected:
          - GNOME's black veil at 80 % — too dark
          - a lighter veil of the scheme's colour, 0.3 in the dark case and 0.2 in the light one, eased in as GNOME's is, as until 2026-11-20 — the shell blinked as a folder opened
          - that veil set at once, with no animation — the author wanted no veil at all
        by: author
        date: 2026-11-20
      - id: card-accent
        description: An open folder's card is the dock's pane in both cases — its colour, its share of the accent (25 % in the light case, 12.5 % in the dark one), its alpha and its outline. The author found the light dock and folder tiles look like panes of glass and made that the standard, the card included (2026-11-20).
        rejected:
          - a card of its own, 6 % of the accent in the light case and a denser near-black with 9 % in the dark one, as until 2026-11-20 — the author chose the dock's pane
          - in the light case, the dock's near-white with 6 % and later 25 % of the accent and no outline — 5 % too little, 7 % a touch too much, 25 % too colourful before the outline
        by: author
        date: 2026-11-19
      - id: card-only-blur
        description: Only what lies under an open folder's card is blurred, once, as the folder opens; the overview around the card stays sharp. Blurring the whole overview behind the folder looked doubtful to the author, and the card alone keeps the folder reading as a card of its own. Made once rather than at every repaint so that a hover inside the folder costs nothing and leaves no steps of blur behind (see the guideline on static glass, which keeps the measurements).
        rejected:
          - the whole overview blurred behind the folder, as from 2026-11-03 — doubtful to look at, the most frames lost and steps of blur around a hovered icon
          - the same dynamic blur under the card alone — a third of the frames back, the steps still there inside the card, where the icons are hovered
          - no blur at all — the grid shows through a glassy card
        by: author
        date: 2026-11-19
  - id: panel-and-overview-meet
    description: The panel keeps its frosted look in the overview. GNOME makes the panel transparent there, and the overview's own picture behind it is the same baked glass, so the panel reads as part of the overview with no seam, and opening or closing the overview shows no flash or jump in the strip the panel covers. That glass is a little denser under the panel than below it — darker in the dark case, lighter in the light one, fading out below the panel (decisions#panel-band) — so the panel on the desktop is a surface of its own while the overview keeps the lightness that suits it, and in the overview the band is only a soft shading at the top. While a folder is open the panel stays as it is (`behaviour#folder-over-blur`).
    scenarios:
      - id: into-overview
        given: the desktop with no window open
        when: the overview is opened and closed again
        then: the strip under the panel looks the same throughout, with no seam between the panel and the overview and no flash while they animate
    decisions:
      - id: panel-band
        description: The strip under the panel is baked into the same glass a little denser — black at 5 % in the dark case, white at 20 % in the light one, fading out below the panel over 18.5 % of the monitor's height (200 logical px on a screen 1080 high). The dark band was first 25 %, which left the panel too dark on most wallpapers, then 15 %. Both faded over 60 px at first; with the light glass's gain at 0.6 the light band showed as a stripe on a dark wallpaper's top, and the longer fade hid it, which the author then took for the dark case too (2026-11-20). On several wallpapers the author wanted the panel darker than the overview could bear (dark case) or lighter (light case); the band gave both, and in the overview it is not seen as a band, or seen blurred, which the author did not mind.
        rejected:
          - one lightness for both, the panel's or the overview's — one of them always looked wrong
          - a panel glass of its own — a seam, and a change of colour as the overview opens
          - white at 30 % and 40 % in the light case — too much on dark wallpapers
        by: author
        date: 2026-11-20
  - id: follows-colour-scheme
    description: "Every surface follows GNOME's dark style, as Quick Settings' Dark Style toggle and Settings › Appearance set it: with dark style on, a dark glass with light text; with it off, a light glass with dark text — the panel, its buttons and icons included, and the overview, dash, search and folders too, which GNOME leaves dark — and GNOME's own menus, Quick Settings, calendar and notifications go light with them (see the guideline on light or dark). A change takes effect at once, in the running session: the two cases' glasses differ in lightness, so the glass is baked again, once per monitor."
    scenarios:
      - id: switch-to-light
        given: dark style on, the overview open on the app grid
        when: dark style is switched off in Quick Settings
        then: the panel with its text and icons, the app grid background, the dash and the search entry turn light with dark labels at once, the wallpaper still blurred behind them, with no relogin
      - id: menus-light
        given: dark style off
        when: Quick Settings is opened
        then: it is GNOME's light Quick Settings, as GNOME draws it for prefer-light
      - id: prefer-light
        given: dark style on
        when: color-scheme is set to prefer-light, which only gsettings sets
        then: everything is light, as with dark style off
      - id: switch-to-dark
        given: the light scheme
        when: the scheme is switched to dark
        then: everything goes back to the dark glass with light labels
  - id: follows-wallpaper
    description: "A new wallpaper, a monitor added, removed or rearranged, and a new scale factor are picked up while the session runs: the affected monitors' glasses are baked anew and the surfaces show them, with no relogin. These, a switch of colour scheme and a new depth setting are the only moments, beside enabling the extension, when anything is blurred. The glass adapts to the wallpaper it shows (decisions#live-tuned): before each bake the extension reads a small copy of that wallpaper — the picture GNOME shows for the current colour scheme, the current frame of a slideshow, the colour of a wallpaper that is only a colour — and takes from it the lightness of the strip under the panel and the mean hue, from which the case's rules give the glass's lightness and how much of the wallpaper's colour it keeps (see the guideline on the glass's colour). So a dark glass is as dark over a white wallpaper as over a night scene, and neither a blue sky nor a garish orange floods the glass."
    scenarios:
      - id: new-wallpaper
        given: the desktop
        when: the wallpaper is changed in Settings
        then: the panel shows the new wallpaper blurred within a moment, and so does the overview when opened next
      - id: monitor-added
        given: one monitor
        when: a second monitor is connected
        then: the overview on the new monitor shows its wallpaper blurred
    decisions:
      - id: live-tuned
        description: "The glass adapts to the wallpaper by rules found live on the author's own screen, in a session that let the agent re-bake the glass and switch wallpapers and accents while the author looked: some twenty wallpapers of the author's, dark to near-white, muted to the most colourful, in both cases, each tuned by eye and then a candidate rule checked on wallpapers it was not tuned on, until the checks needed no correction. The dark case needed it: one target made a light wallpaper's dark glass grey and its panel see-through, and a colourful one's glass blue or garish; the targets the author chose fell on a line of the lightness under the panel (within one step of their tuning on all of them), and the colour they let stay depended on the hue, blue least. A band under the panel settled what that line could not, a panel and an overview each wanting their own lightness. The light case at the reference's values looked right on all of them, save a cap on colour for orange."
        rejected:
          - one lift per case for every wallpaper, as until 2026-11-20 — a dark glass grey and see-through over light wallpapers, blue under a sky
          - the target from the whole wallpaper's mean lightness — twice the error of the strip under the panel
          - a set share of the wallpaper's chroma — a colourful wallpaper floods the glass, a muted one leaves it grey
          - choosing in the appearance lab's frames and by its measures — they did not show what the author's screen showed
        by: author
        date: 2026-11-20
  - id: costs-nothing-at-rest
    description: "While the desktop is in use nothing is blurred and no shader runs on the glass: moving and resizing windows, the clock ticking, indicators changing, opening and closing the overview, sliding between workspaces and the panel coming back after a full-screen window all only show a glass already baked. An open folder is the one exception, and only once: what lies under its card is blurred as it opens and then only shown (`behaviour#folder-over-blur`). A session with the extension uses no more GPU time frame to frame than one without it, apart from drawing a few textures."
    scenarios:
      - id: clock-tick
        given: the desktop, the extension enabled and settled
        when: a few minutes pass, the clock in the panel changing, with the extension enabled and then with it disabled
        then: gnome-shell's CPU time over the same span is the same either way, within noise — had the panel been blurred at its repaints, every tick of the clock would show
      - id: overview-shows-baked
        given: the extension enabled and settled
        when: the overview and the app grid are opened and closed a few times
        then: "the overview's glass is a texture already made: no blur or other effect is attached to it, so nothing is rendered again at its showing"
  - id: rest-left-to-gnome
    description: "Everything else stays as GNOME draws it in the variant the dark style picks — popups aside, which take the glass's colours (`behaviour#popups`): notification banners, OSDs, the window switcher, the screenshot UI, the lock screen and the login screen, and application windows. The extension gives them no glass and restyles none of them; it only picks which of GNOME's two variants they are drawn in (see the guideline on light or dark). Blur my Shell had been set up to leave them alone too, the lock screen and the screenshot UI aside (decisions#lock-and-screenshot)."
    scenarios:
      - id: lock-screen-is-gnome
        given: the extension enabled
        when: the screen is locked
        then: the lock screen shows GNOME's own blurred wallpaper, and after unlocking the panel and the overview are frosted again
    decisions:
      - id: lock-and-screenshot
        description: The lock screen and the screenshot UI are left to GNOME like the rest, although Blur my Shell had been set up to blur them.
        rejected:
          - glass on the lock screen and the screenshot UI, as Blur my Shell had them
        by: author
        date: 2026-11-03
  - id: light-optional
    description: "The light style can be switched off in the extension's preferences — on by default. Off, everything stays dark whatever GNOME's dark style is: the dark glass with light text, and GNOME's own panel, menus, Quick Settings and notifications, even for prefer-light, which would otherwise make GNOME light by itself. For whoever wants applications light and the shell dark, as GNOME 50 has it by default. The switch takes effect at once, in the running session."
    scenarios:
      - id: off-stays-dark
        given: dark style off, the light style switched on
        when: the light style is switched off in the preferences
        then: the panel, the overview and Quick Settings turn dark at once, as with dark style on
      - id: off-even-for-prefer-light
        given: the light style switched off
        when: color-scheme is set to prefer-light
        then: everything stays dark, GNOME's menus included
  - id: tint-tunable
    description: "The glass can be tuned in the extension's preferences, to find on a real screen what looks best (decisions#tunable), around the look tuned live rather than away from it (decisions#scales): whether GNOME's accent colour is mixed in at all, then its strength, and the depth of the dark and of the light glass, each a scale from 50 to 150 % of the designed look, 100 % by default. The accent strength scales the accent's shares together — at 100 %, 8 % on the glass, 25 % on the dock, folder tiles and an open folder's card in the light case; in the dark one 12.5 % on them, and on the glass the share its accent colour gives it, 3.2 % for purple and less for a lighter accent (see the guideline on the glass's colour) — so their proportions stay. The depth moves the glass's lightness away from or toward mid-grey from what the wallpaper gives it: the light glass's target from 75 at 50 % through 80 to 85 at 150 %, the dark one's 12 higher at 50 % and 12 lower at 150 %. A change shows at once on every surface: a depth re-bakes the current case's glass, the accent settings only write the accent stylesheet again, and so does a new accent colour in the dark case, where its share depends on it."
    scenarios:
      - id: accent-off
        given: the accent tint on
        when: it is switched off in the preferences
        then: the glass, the dock, the folder tiles and an open folder's card lose their hue of the accent at once, with nothing baked again
      - id: light-accent
        given: the dark case, the overview open, GNOME's accent purple
        when: the accent is switched to yellow in Settings › Appearance
        then: the glass takes much less of the yellow than it took of the purple — the shares their luminances give — and its tint stays as faint as purple's was
      - id: depth-changed
        given: dark style on
        when: the dark depth is set to 150 % in the preferences
        then: within a moment the glass is darker, its lightness that of target 0 rather than 12, the wallpaper's hue and pattern still showing
    decisions:
      - id: tunable
        description: The glass is set in the preferences rather than fixed in the code, so what looks best can be found on a real screen.
        by: author
        date: 2026-11-03
      - id: scales
        description: "The accent and the depths are set as scales of the designed look, 50 to 150 %, rather than as raw values: at 100 % the glass is exactly what the rules tuned live give, and moving a slider keeps their proportions. The settings were reset to their defaults by the change: their keys are new (components#settings), since the old ones meant an accent percentage and a tint's opacity."
        rejected:
          - raw values — an accent percentage of the tint, 5 to 30 %, and a tint's opacity per case, as the extension had until 2026-11-19
          - a wider range — the light glass reads below 4.5:1 under 75
          - the accent switch alone, with the shares fixed in the stylesheet
        by: author
        date: 2026-11-19
  - id: popups
    description: "GNOME's popups — menus, Quick Settings, the calendar with its notifications, dialogs — take the glass's colours instead of GNOME's neutral ones, which looked out of place beside the glass. They are opaque, since a popup lies over windows, under which no glass can be baked. In the light case GNOME's are near-white with white cards and neutral grey buttons: the popup is the panes' grey with a touch of the accent, 4 % at the default strength, its buttons and submenus are the dock's pane over it, its cards — notifications, the open menus of Quick Settings, the calendar's events — that pane as it shows over the popup but opaque, since GNOME stacks notifications one on another and shows a banner over windows, where a translucent card let through the text under it and the wallpaper, and what GNOME paints in the popup's white so as to look flat — calendar days, flat buttons — is clear. While a toggle's menu is open GNOME dims the rest of Quick Settings by 40 % of their brightness, which turned the light popup grey; in the light case the extension retargets GNOME's running transition to a dim of 15 %. A dialog's buttons take the panes' colours in both cases. In the dark case GNOME's greys are kept in their order of lightness but made 10 % darker, the popup with 2 % of the accent and its cards, buttons and submenus with 7 %; In both cases the text takes a little of the accent too — GNOME's near-black text 15 % in the light case, its white text, an off-white, 7 % in the dark one, and its dimmed text — the weekday over the calendar, the headings of its sections — 20 % — unless the text tint is switched off in the preferences. Every share scales with the accent strength. GNOME's own states — hover, press, focus, a toggle switched on, today in the calendar, a default button — keep their order among themselves, and what GNOME colours with the accent stays the accent: its whole cascade of popup colours is copied under the case's style class with only its neutral colours replaced (components#accent-styles)."
    scenarios:
      - id: light-popup-tinted
        given: the light case
        when: a popup, a notification card and a Quick Settings toggle are styled by the theme
        then: the popup is the panes' grey with 4 % of the accent, opaque; the card and the toggle are the dock's pane; a toggle switched on is still the accent
      - id: quick-settings
        given: the extension enabled, dark style on
        when: Quick Settings are opened
        then: where nothing lies on the popup it shows the extension's popup colour, not GNOME's
      - id: dark-popup-tinted
        given: the dark case
        when: a popup, a notification card and a Quick Settings toggle are styled by the theme
        then: the popup is darker than GNOME's with 2 % of the accent, opaque; the card is lighter than the popup and tinted; a toggle switched on is still the accent
    decisions:
      - id: popup-tint
        description: The popups' colours were found live on the author's screen. In the light case the popup's tint at the edge of being seen; the cards then the dock's pane, which the author found much better than white or a lighter shade of the popup; then the greys, by recolouring GNOME's cascade whole, since rules laid over it outweighed GNOME's own for a toggle switched on, which lost its accent but kept its white label. In the dark case the dock's pane was no answer — darker than GNOME's popup, it would vanish in it — so GNOME's greys keep their lightness, darkened and tinted; at first they looked worse than GNOME's own, and the author tuned them until better (2026-11-20).
        rejected:
          - in the light case, the dock's 25 % of the accent in the popup itself — far too much colour; 8 %, 3 % and 2 % — too much, then a little too little; 0.5 % — too little
          - in the light case, the cards a shade lighter than the popup with its tint — the author wanted them as the dock
          - recolouring GNOME's buttons by rules of the extension's own, over GNOME's — a toggle switched on lost its accent
          - in the dark case, GNOME's lightness with 4–8 % of the accent in the popup and the dock's 12.5 % in its cards — too light, too much accent; 3 % darker — still light; 15 % darker — far too dark; 11 % — darker than wanted
          - in the dark case, a button that cannot be used left GNOME's grey — it stood out grey among tinted ones
          - in the dark case, GNOME's pure white text — too white over the darker popup
          - in the light case, the text with 7 % of the accent — no different to the eye from GNOME's near-black
          - in the light case, translucent cards — the stand showed a stack of notifications reading through one another and a banner showing the wallpaper
          - in the light case, GNOME's 40 % dim while a toggle's menu is open — the popup turned grey, in GNOME's own light style too
        by: author
        date: 2026-11-20
  - id: disable-restores
    description: "Disabling the extension gives GNOME's look back entirely and at once: every actor it added is destroyed, its stylesheet unloads with it and so does the accent stylesheet it wrote, its file removed, the session mode's colour scheme is GNOME's own again, a folder it kept clear is veiled by GNOME again the next time it opens, and no surface is left transparent over nothing."
    scenarios:
      - id: disable
        given: the extension enabled, the overview closed
        when: the extension is disabled
        then: the panel is GNOME's solid colour again, and the overview, dash and folders look as GNOME draws them
components:
  - id: glass
    type: GJS module
    src: borshevik-glass@komorebinator/glass.js
    description: "One monitor's glass, baked (see the guideline on static glass): a Meta.BackgroundGroup that GNOME's BackgroundManager fills with the monitor's wallpaper, at the bottom of Main.uiGroup under GNOME's own wallpaper, so it can be painted there without being seen. When the BackgroundManager has the wallpaper in, or a new one, the glass reads it as the rules need it (components#adapt): the file GNOME shows for the current colour scheme — picture-uri-dark under GNOME's dark style, picture-uri otherwise, as GNOME's background.js picks it — or a slideshow's current frame from GNOME's own Background, decoded small with GdkPixbuf off the main loop, or the background's colour when there is no picture or it cannot be read. The extension gives it the case and the depth; from those and the wallpaper the rules give the lift. To bake, it is given Shell.BlurEffect in ACTOR mode at radius 30 logical px (brightness 1), the lift — a Shell.GLSLEffect whose fragment snippet is the lift (see the guideline on the glass's colour), with the target, gain and chroma as uniforms, and after it the case's band mixed in over the height of the panel on the primary monitor and fading out below (none on other monitors, which have no panel) — and outermost a do-nothing Clutter.OffscreenEffect, and shown for one frame; after it the outer effect's texture is the baked glass, kept as a Clutter.TextureContent, and the effects are removed and the copy hidden, freeing their buffers while its BackgroundManager goes on watching the wallpaper. A new wallpaper (BackgroundManager's changed), a new case or a new depth bakes again, unless the lift and the picture are what was baked; a new monitor layout or scale factor makes the glasses anew. Every surface of the monitor shows the content through an actor of its own, under the accent widget (components#accent-styles); until the first bake is done they show nothing, over GNOME's own background."
  - id: adapt
    type: GJS module
    src: borshevik-glass@komorebinator/adapt.js
    description: "The rules the glass adapts by (see the guideline on the glass's colour, `behaviour#follows-wallpaper`), with their numbers: what is read off the wallpaper, and the lift, the band under the panel and the dark glass's share of the accent each case takes from it. What is read is a copy of the wallpaper 144 px wide, cropped to the monitor's shape as GNOME's zoom crops it and blurred by a pixel twice over, standing in for the blurred glass at that size: the mean CIELAB lightness of its top rows, the panel's height of the screen, and the hue of its mean colour. The dark case's target is 12 − 0.2 × that lightness and its gain 0.3; the light case's 80 and 0.6; a depth moves either target by its step per unit. The chroma kept is the largest share, up to 0.5 in the dark case and the whole in the light one, that leaves no more than the case's amount of colour in the lifted glass on average — found by halving over a few thousand of its pixels, lifted and clamped as the shader does them, since a colour clamped in sRGB comes out lighter and more colourful than its CIELAB chroma says. The amount follows the hue, a cosine bump around purple-magenta (305°) up and, in the dark case, one around blue (250°) down. The numbers are those the author settled live (decisions#live-tuned of follows-wallpaper; the session's notes are not kept in the repository). Plain arithmetic, with no GNOME Shell import, so the test machine's runner (tests/vm/run.js) asks it what the glass on its striped wallpapers should be, rather than keeping a second copy of the rules that would drift; what the shader draws from a lift the runner still works out on its own."
  - id: folder-backdrop
    type: GJS module
    src: borshevik-glass@komorebinator/folder.js
    description: "The blur under an open folder's card (`behaviour#folder-over-blur`), one per folder dialog GNOME makes, baked the way the glass is (components#glass). What is shown lies in the overview's group right under the dialog. As the folder opens it is baked: a Clutter.Clone of each visible actor under the dialog in that group — the overview's glass and GNOME's overview with its grid and dash — at their own places, under Shell.BlurEffect in ACTOR mode at the glass's radius, under glass.js's grab effect, painted for one frame at the bottom of Main.uiGroup where nothing of it is seen; the grab's texture is kept as the picture's content, at the offset of Clutter's padding (glass.js BAKE_MARGIN), and the clones and effects go. Cloned and blurred live instead, the clones were rendered again at every frame of the folder's animation, since something in GNOME's overview redraws while it runs, and the folder opened with fewer frames than under the old dynamic blur (4–7 against 8–10 in the test machine; 6–13 baked, with one longer frame for the bake). Over the picture a Shell.GLSLEffect keeps only the card's rounded rectangle, at the card's opacity: its uniforms — the card's rectangle on the screen, its corner radius and its container's opacity — are read from the card as the effect paints, and GNOME moving, scaling or fading the card's container only asks it to paint again, so the blur grows out of the folder's tile with the card and fades with it. Read as it paints, not as GNOME announces the changes: as the first folder of a session opens, its card has no place yet when the folder says it opens, no change was announced after, and that folder came out blurred whole (seen in the test machine). The mask works in texture coordinates, which cover the backdrop with the same padding. Closing the folder drops the picture; the backdrop goes with the dialog, or with the extension."
  - id: stylesheets
    type: "@ConfigFile"
    format: CSS (GNOME Shell St theming)
    src: borshevik-glass@komorebinator/stylesheet.css
    description: "What does not depend on the accent: the restyling of GNOME's own panel, overview, dash, search and folder selectors — transparent where the glass shows, the text's colours, the light case's hairlines on the dash and folder tiles — and the surfaces' look with no accent: plain rules for what both share and for the dark case, rules under .borshevik-glass-light for the light one (see the guideline on light or dark). Everything mixed with the accent is in the accent template (components#accent-styles)."
  - id: accent-styles
    type: "@ConfigFile"
    format: CSS (GNOME Shell St theming) with placeholders
    src: borshevik-glass@komorebinator/accent.css
    description: "A template of every rule that mixes in GNOME's accent colour: the accent widget over the glass, the surfaces of the dash, search entry, workspace thumbnails, folder tiles, page arrows and an open folder's controls in their rest, hover and pressed states, an open folder's card among them — dark and light, as in the stylesheet — and GNOME's popups in both cases (`behaviour#popups`), a block written by tools/popups.py from GNOME's stylesheets between two marking comments, which the script replaces when run again. Each colour is written with St's colour functions, st-mix(-st-accent-color, <base>, <share>) and st-transparentize, so GNOME resolves the accent colour itself; the shares are placeholders for the glass's, the surfaces' and the popups' share of the accent, one set for each case. The extension fills them in — 8 % over the glass and 25 % on the surfaces in the light case, 4 % in its popups, 15 % in their text and 20 % in their dimmed text; in the dark one 12.5 % on the surfaces, 2 % in the popups, 7 % on their cards and buttons and in their text and 20 % in their dimmed text, the text's shares none with the text tint off, and over the glass the share the accent colour gives it (components#adapt), which the extension reads off a hidden widget coloured -st-accent-color and reads again when GNOME's accent changes, writing the stylesheet anew only if the share moved; all times the accent strength, or 0 with the accent switched off (`behaviour#tint-tunable`) — writes the result to a file of its own under the user's runtime directory and loads it into GNOME's theme after its stylesheet, again whenever an accent setting changes, unloading the copy before; on disable it unloads it and removes the file. Its rules win over the stylesheet's by being more specific, never by coming later (decisions#outweigh). A stylesheet rather than inline styles because the surfaces are many actors GNOME makes and remakes — every folder tile, every dialog — which a stylesheet reaches as they appear."
    decisions:
      - id: outweigh
        description: A rule here that must win over one of the stylesheet's is made more specific than it. Of two equally specific rules from the two files St applied the stylesheet's, though it was loaded first, so the dash's hover and checked highlight — written with the same weight as the stylesheet's rule that takes the dash icons' backdrop away — never showed in the dark case; the light case's rules carry .borshevik-glass-light and won. The dash rules name the dash's item container to outweigh that rule.
        rejected:
          - relying on the accent stylesheet being loaded after the stylesheet — St did not honour it
        date: 2026-11-19
  - id: metadata
    type: "@ConfigFile"
    format: JSON
    src: borshevik-glass@komorebinator/metadata.json
    description: "Extension manifest: GNOME Shell 50, the version Borshevik ships, no session modes beyond the user's, the settings schema and the gettext domain the preferences use."
  - id: settings
    type: "@ConfigFile"
    format: GSettings schema (XML)
    src: borshevik-glass@komorebinator/schemas/org.gnome.shell.extensions.borshevik-glass.gschema.xml
    description: "The extension's settings: light-style (`behaviour#light-optional`), on by default; and the glass's (`behaviour#tint-tunable`) — accent-tint, on by default, accent-scale, dark-depth-scale and light-depth-scale, per cent from 50 to 150, 100 by default, and text-tint, on by default, whether the popups' text takes the accent too (`behaviour#popups`). The scales are new keys rather than the old accent-amount, dark-depth and light-depth with a new meaning, so a value set under the old meaning is not read under the new one. The extension follows their changes in the running session."
  - id: preferences
    type: "@View"
    src: borshevik-glass@komorebinator/prefs.js
    description: "The preferences window GNOME's Extensions app opens: one page — Light style, a switch with a line under it saying what switching it off does; then the glass group: Accent tint, a switch, Accent amount, a slider from 50 to 150 % shown only while the accent tint is on, Tinted text, a switch shown likewise, and Dark depth and Light depth, sliders from 50 to 150 %, each with a mark at 100 % — the look the extension was designed with. Each is bound to its setting, so a move shows on the screen at once."
  - id: translations
    type: "@ConfigFile"
    format: gettext (.pot template, .po per-locale, compiled .mo)
    src:
      - po/borshevik-glass@komorebinator.pot
      - po/ru.po
      - borshevik-glass@komorebinator/locale/ru/LC_MESSAGES/borshevik-glass@komorebinator.mo
    description: "The preferences' strings in Russian, Borshevik's other language. The extension draws no text of its own in the shell, so only the preferences are translated."
